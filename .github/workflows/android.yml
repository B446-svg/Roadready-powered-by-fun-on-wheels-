


name: Build RoadReady Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "Missing Gradle wrapper."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Missing Gradle wrapper JAR."
            exit 1
          fi

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "Missing Gradle settings file."
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload RoadReady APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadReady-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
